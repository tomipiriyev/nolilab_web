<html lang="en">
<head>

  <script>window.location.replace("/smallest-gps-tracker/");</script>

<link rel="alternate" hreflang="en" href="https://www.nolilab.com/ultra-compact-gps-tracker-recommended/" />
<link rel="alternate" hreflang="ja" href="https://www.nolilab.com/ja/ultra-compact-gps-tracker-recommended/" />
<link rel="alternate" hreflang="es" href="https://www.nolilab.com/es/ultra-compact-gps-tracker-recommended/" />
<link rel="alternate" hreflang="ru" href="https://www.nolilab.com/ru/ultra-compact-gps-tracker-recommended/" />
<link rel="alternate" hreflang="zh" href="https://www.nolilab.com/zh/ultra-compact-gps-tracker-recommended/" />
<link rel="alternate" hreflang="fr" href="https://www.nolilab.com/fr/ultra-compact-gps-tracker-recommended/" />
</head>
<body>
  <p>Redirecting to <a href="/smallest-gps-tracker/">the current page</a>.</p>

  <!-- Size comparison diagram: Loko Air vs common objects -->
  <svg viewBox="0 0 900 280" role="img" aria-label="Size comparison of Loko Air GPS tracker (28.5 by 20.5 by 5.9 millimeters, 15 grams) against a coin, SD card, and USB drive" style="width:100%;height:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;">
    <title>Loko Air size comparison with common objects</title>

    <!-- Title -->
    <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="var(--text-primary)">Size Comparison — Loko Air vs Common Objects</text>

    <!-- Scale reference line -->
    <line x1="60" y1="250" x2="840" y2="250" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="450" y="270" text-anchor="middle" font-size="11" fill="var(--text-secondary)">All objects shown at approximately the same visual scale</text>

    <!-- ====== Coin (US Quarter ~24.3mm diameter) ====== -->
    <g transform="translate(120, 60)">
      <!-- Coin circle -->
      <circle cx="60" cy="60" r="55" fill="#b0b0b0" stroke="#888" stroke-width="1.5" opacity="0.7"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="#999" stroke-width="0.8"/>
      <text x="60" y="58" text-anchor="middle" font-size="11" fill="#555" font-weight="500">US Quarter</text>
      <text x="60" y="72" text-anchor="middle" font-size="10" fill="#666">24.3mm ⌀</text>
      <!-- Dimension line -->
      <line x1="5" y1="125" x2="115" y2="125" stroke="#888" stroke-width="1"/>
      <line x1="5" y1="120" x2="5" y2="130" stroke="#888" stroke-width="1"/>
      <line x1="115" y1="120" x2="115" y2="130" stroke="#888" stroke-width="1"/>
      <text x="60" y="142" text-anchor="middle" font-size="10" fill="var(--text-secondary)">24.3mm</text>
      <text x="60" y="165" text-anchor="middle" font-size="12" fill="var(--text-secondary)" font-weight="500">Coin</text>
    </g>

    <!-- ====== SD Card (25 × 32mm) ====== -->
    <g transform="translate(310, 50)">
      <!-- SD card shape with notched corner -->
      <polygon points="8,0 92,0 100,8 100,130 0,130 0,8" fill="#c0c0c0" stroke="#888" stroke-width="1.5" opacity="0.7"/>
      <!-- Label area on card -->
      <rect x="10" y="10" width="80" height="50" rx="2" fill="#d8d8d8" stroke="#aaa" stroke-width="0.5"/>
      <text x="50" y="35" text-anchor="middle" font-size="10" fill="#555" font-weight="500">SD Card</text>
      <text x="50" y="50" text-anchor="middle" font-size="9" fill="#666">25×32mm</text>
      <!-- Width dimension -->
      <line x1="0" y1="142" x2="100" y2="142" stroke="#888" stroke-width="1"/>
      <line x1="0" y1="137" x2="0" y2="147" stroke="#888" stroke-width="1"/>
      <line x1="100" y1="137" x2="100" y2="147" stroke="#888" stroke-width="1"/>
      <text x="50" y="158" text-anchor="middle" font-size="10" fill="var(--text-secondary)">25mm</text>
      <!-- Height dimension -->
      <line x1="112" y1="0" x2="112" y2="130" stroke="#888" stroke-width="1"/>
      <line x1="107" y1="0" x2="117" y2="0" stroke="#888" stroke-width="1"/>
      <line x1="107" y1="130" x2="117" y2="130" stroke="#888" stroke-width="1"/>
      <text x="130" y="68" text-anchor="middle" font-size="10" fill="var(--text-secondary)">32mm</text>
      <text x="50" y="180" text-anchor="middle" font-size="12" fill="var(--text-secondary)" font-weight="500">SD Card</text>
    </g>

    <!-- ====== Loko Air (28.5 × 20.5 × 5.9mm, 15g) ====== -->
    <g transform="translate(510, 55)">
      <!-- Loko Air body — rounded rectangle -->
      <rect x="0" y="0" width="114" height="82" rx="10" ry="10" fill="#238636" stroke="#1a6a2a" stroke-width="2" opacity="0.85"/>
      <!-- Inner detail: antenna line -->
      <line x1="15" y1="15" x2="99" y2="15" stroke="#2ea043" stroke-width="1.5" opacity="0.6"/>
      <!-- LED indicator -->
      <circle cx="57" cy="41" r="6" fill="#2ea043" stroke="#56d364" stroke-width="1"/>
      <!-- Label -->
      <text x="57" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Loko Air</text>
      <!-- Width dimension -->
      <line x1="0" y1="95" x2="114" y2="95" stroke="#238636" stroke-width="1.2"/>
      <line x1="0" y1="90" x2="0" y2="100" stroke="#238636" stroke-width="1.2"/>
      <line x1="114" y1="90" x2="114" y2="100" stroke="#238636" stroke-width="1.2"/>
      <text x="57" y="112" text-anchor="middle" font-size="10" fill="#238636" font-weight="600">28.5mm</text>
      <!-- Height dimension -->
      <line x1="126" y1="0" x2="126" y2="82" stroke="#238636" stroke-width="1.2"/>
      <line x1="121" y1="0" x2="131" y2="0" stroke="#238636" stroke-width="1.2"/>
      <line x1="121" y1="82" x2="131" y2="82" stroke="#238636" stroke-width="1.2"/>
      <text x="148" y="44" text-anchor="middle" font-size="10" fill="#238636" font-weight="600">20.5mm</text>
      <!-- Weight & thickness -->
      <text x="57" y="135" text-anchor="middle" font-size="11" fill="#238636" font-weight="600">Loko Air</text>
      <text x="57" y="150" text-anchor="middle" font-size="10" fill="var(--text-secondary)">5.9mm thick · 15g</text>
    </g>

    <!-- ====== USB Drive (~65 × 20 × 10mm typical) ====== -->
    <g transform="translate(730, 50)">
      <!-- USB-A connector -->
      <rect x="20" y="0" width="40" height="18" rx="1" fill="#a0a0a0" stroke="#888" stroke-width="1"/>
      <!-- USB body -->
      <rect x="5" y="18" width="70" height="110" rx="5" fill="#b8b8b8" stroke="#888" stroke-width="1.5" opacity="0.7"/>
      <!-- USB label -->
      <text x="40" y="65" text-anchor="middle" font-size="10" fill="#555" font-weight="500">USB</text>
      <text x="40" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="500">Drive</text>
      <text x="40" y="95" text-anchor="middle" font-size="9" fill="#666">~65×20mm</text>
      <!-- Width dimension -->
      <line x1="5" y1="140" x2="75" y2="140" stroke="#888" stroke-width="1"/>
      <line x1="5" y1="135" x2="5" y2="145" stroke="#888" stroke-width="1"/>
      <line x1="75" y1="135" x2="75" y2="145" stroke="#888" stroke-width="1"/>
      <text x="40" y="157" text-anchor="middle" font-size="10" fill="var(--text-secondary)">20mm</text>
      <!-- Height dimension -->
      <line x1="87" y1="0" x2="87" y2="128" stroke="#888" stroke-width="1"/>
      <line x1="82" y1="0" x2="92" y2="0" stroke="#888" stroke-width="1"/>
      <line x1="82" y1="128" x2="92" y2="128" stroke="#888" stroke-width="1"/>
      <text x="105" y="68" text-anchor="middle" font-size="10" fill="var(--text-secondary)">~65mm</text>
      <text x="40" y="175" text-anchor="middle" font-size="12" fill="var(--text-secondary)" font-weight="500">USB Drive</text>
    </g>
  </svg>
</body>
</html>
