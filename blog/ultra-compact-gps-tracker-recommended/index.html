<!DOCTYPE html>

<html lang="en">
<head>
<link href="/css/partials.css" rel="stylesheet"/>
<meta charset="utf-8"/>

<body>
<p>Redirecting to <a href="/smallest-gps-tracker/">the current page</a>.</p>
<!-- Size comparison diagram: Loko Air vs common objects -->
<svg aria-label="Size comparison of Loko Air GPS tracker (28.5 by 20.5 by 5.9 millimeters, 15 grams) against a coin, SD card, and USB drive" role="img" style="width:100%;height:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;" viewbox="0 0 900 280">
<title>Loko Air size comparison with common objects</title>
<!-- Title -->
<text fill="var(--text-primary)" font-size="15" font-weight="600" text-anchor="middle" x="450" y="28">Size Comparison — Loko Air vs Common Objects</text>
<!-- Scale reference line -->
<line stroke="var(--border)" stroke-dasharray="4,3" stroke-width="1" x1="60" x2="840" y1="250" y2="250"></line>
<text fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="450" y="270">All objects shown at approximately the same visual scale</text>
<!-- ====== Coin (US Quarter ~24.3mm diameter) ====== -->
<g transform="translate(120, 60)">
<!-- Coin circle -->
<circle cx="60" cy="60" fill="#b0b0b0" opacity="0.7" r="55" stroke="#888" stroke-width="1.5"></circle>
<circle cx="60" cy="60" fill="none" r="48" stroke="#999" stroke-width="0.8"></circle>
<text fill="#555" font-size="11" font-weight="500" text-anchor="middle" x="60" y="58">US Quarter</text>
<text fill="#666" font-size="10" text-anchor="middle" x="60" y="72">24.3mm ⌀</text>
<!-- Dimension line -->
<line stroke="#888" stroke-width="1" x1="5" x2="115" y1="125" y2="125"></line>
<line stroke="#888" stroke-width="1" x1="5" x2="5" y1="120" y2="130"></line>
<line stroke="#888" stroke-width="1" x1="115" x2="115" y1="120" y2="130"></line>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="60" y="142">24.3mm</text>
<text fill="var(--text-secondary)" font-size="12" font-weight="500" text-anchor="middle" x="60" y="165">Coin</text>
</g>
<!-- ====== SD Card (25 × 32mm) ====== -->
<g transform="translate(310, 50)">
<!-- SD card shape with notched corner -->
<polygon fill="#c0c0c0" opacity="0.7" points="8,0 92,0 100,8 100,130 0,130 0,8" stroke="#888" stroke-width="1.5"></polygon>
<!-- Label area on card -->
<rect fill="#d8d8d8" height="50" rx="2" stroke="#aaa" stroke-width="0.5" width="80" x="10" y="10"></rect>
<text fill="#555" font-size="10" font-weight="500" text-anchor="middle" x="50" y="35">SD Card</text>
<text fill="#666" font-size="9" text-anchor="middle" x="50" y="50">25×32mm</text>
<!-- Width dimension -->
<line stroke="#888" stroke-width="1" x1="0" x2="100" y1="142" y2="142"></line>
<line stroke="#888" stroke-width="1" x1="0" x2="0" y1="137" y2="147"></line>
<line stroke="#888" stroke-width="1" x1="100" x2="100" y1="137" y2="147"></line>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="50" y="158">25mm</text>
<!-- Height dimension -->
<line stroke="#888" stroke-width="1" x1="112" x2="112" y1="0" y2="130"></line>
<line stroke="#888" stroke-width="1" x1="107" x2="117" y1="0" y2="0"></line>
<line stroke="#888" stroke-width="1" x1="107" x2="117" y1="130" y2="130"></line>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="130" y="68">32mm</text>
<text fill="var(--text-secondary)" font-size="12" font-weight="500" text-anchor="middle" x="50" y="180">SD Card</text>
</g>
<!-- ====== Loko Air (28.5 × 20.5 × 5.9mm, 15g) ====== -->
<g transform="translate(510, 55)">
<!-- Loko Air body — rounded rectangle -->
<rect fill="#238636" height="82" opacity="0.85" rx="10" ry="10" stroke="#1a6a2a" stroke-width="2" width="114" x="0" y="0"></rect>
<!-- Inner detail: antenna line -->
<line opacity="0.6" stroke="#2ea043" stroke-width="1.5" x1="15" x2="99" y1="15" y2="15"></line>
<!-- LED indicator -->
<circle cx="57" cy="41" fill="#2ea043" r="6" stroke="#56d364" stroke-width="1"></circle>
<!-- Label -->
<text fill="#fff" font-size="11" font-weight="600" text-anchor="middle" x="57" y="65">Loko Air</text>
<!-- Width dimension -->
<line stroke="#238636" stroke-width="1.2" x1="0" x2="114" y1="95" y2="95"></line>
<line stroke="#238636" stroke-width="1.2" x1="0" x2="0" y1="90" y2="100"></line>
<line stroke="#238636" stroke-width="1.2" x1="114" x2="114" y1="90" y2="100"></line>
<text fill="#238636" font-size="10" font-weight="600" text-anchor="middle" x="57" y="112">28.5mm</text>
<!-- Height dimension -->
<line stroke="#238636" stroke-width="1.2" x1="126" x2="126" y1="0" y2="82"></line>
<line stroke="#238636" stroke-width="1.2" x1="121" x2="131" y1="0" y2="0"></line>
<line stroke="#238636" stroke-width="1.2" x1="121" x2="131" y1="82" y2="82"></line>
<text fill="#238636" font-size="10" font-weight="600" text-anchor="middle" x="148" y="44">20.5mm</text>
<!-- Weight & thickness -->
<text fill="#238636" font-size="11" font-weight="600" text-anchor="middle" x="57" y="135">Loko Air</text>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="57" y="150">5.9mm thick · 15g</text>
</g>
<!-- ====== USB Drive (~65 × 20 × 10mm typical) ====== -->
<g transform="translate(730, 50)">
<!-- USB-A connector -->
<rect fill="#a0a0a0" height="18" rx="1" stroke="#888" stroke-width="1" width="40" x="20" y="0"></rect>
<!-- USB body -->
<rect fill="#b8b8b8" height="110" opacity="0.7" rx="5" stroke="#888" stroke-width="1.5" width="70" x="5" y="18"></rect>
<!-- USB label -->
<text fill="#555" font-size="10" font-weight="500" text-anchor="middle" x="40" y="65">USB</text>
<text fill="#555" font-size="10" font-weight="500" text-anchor="middle" x="40" y="78">Drive</text>
<text fill="#666" font-size="9" text-anchor="middle" x="40" y="95">~65×20mm</text>
<!-- Width dimension -->
<line stroke="#888" stroke-width="1" x1="5" x2="75" y1="140" y2="140"></line>
<line stroke="#888" stroke-width="1" x1="5" x2="5" y1="135" y2="145"></line>
<line stroke="#888" stroke-width="1" x1="75" x2="75" y1="135" y2="145"></line>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="40" y="157">20mm</text>
<!-- Height dimension -->
<line stroke="#888" stroke-width="1" x1="87" x2="87" y1="0" y2="128"></line>
<line stroke="#888" stroke-width="1" x1="82" x2="92" y1="0" y2="0"></line>
<line stroke="#888" stroke-width="1" x1="82" x2="92" y1="128" y2="128"></line>
<text fill="var(--text-secondary)" font-size="10" text-anchor="middle" x="105" y="68">~65mm</text>
<text fill="var(--text-secondary)" font-size="12" font-weight="500" text-anchor="middle" x="40" y="175">USB Drive</text>
</g>
</svg>
</body>
</html>
