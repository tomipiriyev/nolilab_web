<!DOCTYPE html>

<html lang="en">
<head>
<link rel="stylesheet" href="/css/partials.css"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loko Firmware Updater | Browser Flash Tool | nolilab</title>
<meta content="Update Loko Air firmware from a compatible browser using a local USB serial connection. Firmware files never leave your computer." name="description"/>
<meta content="noindex, follow" name="robots"/>
<link href="https://www.nolilab.com/stm32-firmware-updater/" rel="canonical"/>
<meta content="website" property="og:type"/>
<meta content="Loko Firmware Updater | Browser Flash Tool | nolilab" property="og:title"/>
<meta content="Update Loko Air firmware from a compatible browser using a local USB serial connection. Firmware files never leave your computer." property="og:description"/>
<meta content="https://www.nolilab.com/stm32-firmware-updater/" property="og:url"/>
<meta content="https://www.nolilab.com/images/optimized/loko-gps-tracker-red-transparent.png" property="og:image"/>
<link href="css/style.css" rel="stylesheet"/>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='5' width='20' height='22' rx='3' fill='%233584e4'/%3E%3Cpath d='M11 11h10M11 16h10M11 21h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" rel="icon"/>
<script defer="" src="/js/layout.js"></script></head>
<body>
<div class="container">
<div class="main-card">
<!-- Header -->
<div id="site-header"></div>
<!-- Device Panel -->
<section class="panel device-panel">
<h1 class="panel-title">
<svg class="panel-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M7 8h10M7 16h10M9 8V5h6v3M9 16v3h6v-3"></path>
<rect height="8" rx="2" width="14" x="5" y="8"></rect>
</svg>
          Device
        </h1>
<div class="device-actions">
<button class="btn btn-primary" id="connect-btn">
<svg class="btn-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 12h8M12 8v8"></path>
<circle cx="12" cy="12" r="8"></circle>
</svg>
            Connect
          </button>
<button class="btn btn-secondary" id="disconnect-btn" style="display: none;">
<svg class="btn-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 6H6v12h3M13 8l4 4-4 4M17 12H9"></path>
</svg>
            Disconnect
          </button>
</div>
<div class="device-info" id="device-info"></div>
</section>
<!-- Firmware Panel -->
<section class="panel firmware-panel">
<h2 class="panel-title">
<svg class="panel-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M7 3h7l4 4v14H7z"></path>
<path d="M14 3v5h4M9 13h6M9 17h6"></path>
</svg>
          Firmware
        </h2>
<div class="drop-zone" id="drop-zone">
<svg class="drop-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v11M8 8l4-4 4 4"></path>
<path d="M5 15v4h14v-4"></path>
</svg>
<p class="drop-text">Drop firmware file</p>
<p class="drop-subtext">BIN or HEX</p>
</div>
<input accept=".bin,.hex" id="file-input" style="display: none;" type="file"/>
<button class="btn btn-secondary firmware-download-btn" id="download-firmware-btn" title="Download latest firmware for Loko Air">
<svg class="btn-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v12M8 11l4 4 4-4"></path>
<path d="M5 19h14"></path>
</svg>
          Download Loko Air Firmware
        </button>
<div class="firmware-info" id="firmware-info" style="display: none;">
<div class="firmware-detail">
<span class="label">File:</span>
<span class="value filename" id="firmware-filename"></span>
</div>
<div class="firmware-detail">
<span class="label">Size:</span>
<span class="value" id="firmware-size"></span>
</div>
<div class="firmware-detail">
<span class="label">SHA-256:</span>
<span class="value checksum" id="firmware-checksum"></span>
</div>
</div>
</section>
<!-- Flash Panel -->
<section class="panel flash-panel">
<h2 class="panel-title">
<svg class="panel-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 3 6 13h5l-1 8 8-12h-5z"></path>
</svg>
          Flash
        </h2>
<div class="flash-actions">
<button class="btn btn-success" disabled="" id="flash-btn">
<svg class="btn-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v12M8 11l4 4 4-4"></path>
<path d="M5 19h14"></path>
</svg>
            Flash
          </button>
</div>
<!-- Progress -->
<div class="progress-container" id="progress-container" style="display: none;">
<div class="progress-header">
<span class="progress-phase" id="progress-phase">Ready</span>
<span class="progress-percent" id="progress-text">0%</span>
</div>
<div class="progress-bar-bg">
<div class="progress-bar" id="progress-bar"></div>
</div>
</div>
<!-- Verification Badge -->
<div class="badge" id="verification-badge" style="display: none;"></div>
</section>
<!-- Log Panel -->
<section class="panel log-panel">
<h2 class="panel-title">
<svg class="panel-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 5h14v14H5z"></path>
<path d="M8 9h8M8 13h8M8 17h5"></path>
</svg>
          Log
        </h2>
<div class="log-container" id="log-container"></div>
</section>
</div>
<footer class="footer">
<p>Local only. Firmware never leaves this browser.</p>
</footer>
</div>
<script src="js/serial.js"></script>
<script src="js/app.js"></script>
</body>
</html>
