name: Ping IndexNow on deploy

on:
  push:
    branches: ["main"]

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # need the previous commit to diff against
          fetch-depth: 2

      - name: Collect changed pages
        id: urls
        run: |
          # Canonical host is www — the apex 301s, so submitting apex URLs meant
          # IndexNow only ever saw redirects, never a canonical page.
          SITE="https://www.nolilab.com"

          # Map each changed index.html to its trailing-slash URL. Anything that
          # is noindex (the redirect stubs) or no longer on disk is skipped, so a
          # deleted or retired page is never submitted.
          : > urls.txt
          git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.html' \
          | while read -r f; do
              case "$f" in
                */index.html|index.html) ;;
                *) continue ;;
              esac
              [ -f "$f" ] || continue
              grep -qi 'name="robots"[^>]*noindex' "$f" && continue
              dir="${f%index.html}"
              printf '%s/%s\n' "$SITE" "$dir" >> urls.txt
            done

          sort -u urls.txt -o urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          echo "Changed pages to submit:"; cat urls.txt

      - name: Ping IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import json, urllib.request

          with open("urls.txt") as fh:
              urls = [l.strip() for l in fh if l.strip()]

          # IndexNow accepts up to 10,000 URLs per request; chunk defensively.
          for i in range(0, len(urls), 1000):
              payload = {
                  "host": "www.nolilab.com",
                  "key": "4d11ad9140055d8a4dc89a65f2439675",
                  "keyLocation": "https://www.nolilab.com/4d11ad9140055d8a4dc89a65f2439675.txt",
                  "urlList": urls[i:i + 1000],
              }
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"submitted {len(payload['urlList'])} URL(s) -> HTTP {resp.status}")
          PY
