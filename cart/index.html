<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5"/>
<title>Cart — Nolilab</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" rel="preload"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/></noscript>
<link href="/css/fa-subset.css" rel="stylesheet"/>
<link href="/css/index.css?v=20260816b" rel="stylesheet"/>
<link href="/css/cart.css" rel="stylesheet"/>
</head>
<body>
<div id="site-header"></div>

<main class="cart-page">
  <div class="cart-layout">

    <!-- Items column -->
    <section class="cart-items-section">
      <h2>Shopping Cart (<span id="cart-count">0</span> items)</h2>

      <!-- Empty state -->
      <div id="cart-empty" class="cart-empty" hidden>
        <p style="font-size:2rem">🛒</p>
        <p>Your cart is empty.</p>
        <a href="/shop/" class="btn-primary">Continue Shopping</a>
      </div>

      <!-- Items list -->
      <div id="cart-items-list"></div>
    </section>

    <!-- Summary sidebar -->
    <aside class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summary-subtotal">$0</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Calculated at checkout</span>
      </div>
      <div class="summary-row total">
        <span>Estimated Total</span>
        <span id="summary-total">$0</span>
      </div>
      <p class="shipping-note">Taxes and final shipping calculated at checkout.</p>
      <a id="btn-checkout" href="/checkout/" class="btn-checkout" aria-disabled="true">
        Proceed to Checkout
      </a>
      <a href="/shop/" class="btn-continue-shopping">← Continue shopping</a>
    </aside>

  </div>
</main>

<div id="site-footer"></div>
<script src="/js/cart.js"></script>
<script src="/js/layout.js?v=20260816" defer></script>
<script>
(function () {
  'use strict';

  function fmt(n) { return '$' + n.toFixed(2).replace(/\.00$/, ''); }

  function render() {
    var items = CartStore.getItems();
    var count = CartStore.getCount();
    var subtotal = CartStore.getSubtotal();

    document.getElementById('cart-count').textContent = count;
    document.getElementById('summary-subtotal').textContent = fmt(subtotal);
    document.getElementById('summary-total').textContent = fmt(subtotal);

    var emptyEl   = document.getElementById('cart-empty');
    var listEl    = document.getElementById('cart-items-list');
    var checkoutBtn = document.getElementById('btn-checkout');

    if (items.length === 0) {
      emptyEl.removeAttribute('hidden');
      listEl.innerHTML = '';
      checkoutBtn.setAttribute('aria-disabled', 'true');
    } else {
      emptyEl.setAttribute('hidden', '');
      checkoutBtn.removeAttribute('aria-disabled');
      listEl.innerHTML = '';
      items.forEach(function (item) {
        listEl.appendChild(makeItemEl(item));
      });
    }
  }

  function makeItemEl(item) {
    var el = document.createElement('div');
    el.className = 'cart-item';
    el.dataset.sku = item.sku;
    el.innerHTML =
      '<div class="cart-item-img"><img src="' + item.image + '" alt="' + item.name + '" width="80" height="80" loading="lazy"/></div>' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-name">' + item.name + '</div>' +
        '<div class="cart-item-sku">SKU: ' + item.sku + '</div>' +
        '<div class="cart-item-price">' + fmt(item.price) + ' each</div>' +
      '</div>' +
      '<div class="cart-item-controls">' +
        '<div class="cart-item-subtotal">' + fmt(item.price * item.quantity) + '</div>' +
        '<div class="cart-qty-group" role="group" aria-label="Quantity">' +
          '<button class="cart-qty-btn" data-act="dec" aria-label="Decrease">−</button>' +
          '<span class="cart-qty-val">' + item.quantity + '</span>' +
          '<button class="cart-qty-btn" data-act="inc" aria-label="Increase">+</button>' +
        '</div>' +
        '<button class="cart-remove-btn" data-act="remove">Remove</button>' +
      '</div>';
    return el;
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var row = btn.closest('.cart-item');
    if (!row) return;
    var sku = row.dataset.sku;
    var items = CartStore.getItems();
    var item = items.find(function (i) { return i.sku === sku; });
    if (!item) return;

    var act = btn.dataset.act;
    if (act === 'remove') {
      CartStore.remove(sku);
    } else if (act === 'inc') {
      CartStore.update(sku, item.quantity + 1);
    } else if (act === 'dec') {
      if (item.quantity <= 1) CartStore.remove(sku);
      else CartStore.update(sku, item.quantity - 1);
    }
    render();
  });

  // Block click when disabled
  document.getElementById('btn-checkout').addEventListener('click', function (e) {
    if (this.getAttribute('aria-disabled') === 'true') e.preventDefault();
  });

  window.addEventListener('cart:updated', render);
  render();
})();
</script>
</body>
</html>
